<html>
<head>

    <style>
        body {

            font-family: Arial, sans-serif;

            justify-content: center;
            align-items: center;
        }

        .card {
            width: 600px;
            background: white;
            padding: 40px;

        }

        p {
            color: #555;
            line-height: 1.6;
        }

            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .button:hover {
            opacity: 0.85;
        }
    </style>

<body>

<div class="card">

    <h1>👥 Concurrent Visitor Counter</h1>
