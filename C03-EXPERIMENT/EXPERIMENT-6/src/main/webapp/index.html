<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dynamic Welcome Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 15% 15%,
                    #37326d,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 85% 85%,
                    #15544f,
                    transparent 30%
                ),

                #080b18;

            color: white;
        }

        .container {
            width: 700px;
            max-width: 90%;

            padding: 50px;

            text-align: center;

            background: #11162b;

            border: 1px solid #2d3555;

            border-radius: 30px;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45);
        }

        .logo {
            width: 75px;
            height: 75px;

            margin: auto;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #14b8a6
                );

            font-size: 32px;
            font-weight: 900;
        }

        .tag {
            display: inline-block;

            margin-top: 25px;

            padding: 8px 16px;

            border-radius: 30px;

            background: #102b2c;

            border: 1px solid #245050;

            color: #4de1d1;

            font-size: 10px;

            font-weight: bold;

            letter-spacing: 1.5px;
        }

        h1 {
            margin-top: 20px;

            font-size: 38px;

            color: white;
        }

        p {
            margin-top: 15px;
            margin-bottom: 30px;

            color: #8d96b5;

            font-size: 14px;

            line-height: 1.7;
        }

        .button {
            display: inline-block;

            padding: 16px 30px;

            border-radius: 12px;

            background:
                linear-gradient(
                    100deg,
                    #6366f1,
                    #14b8a6
                );

            color: white;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;
        }

        .button:hover {
            transform: translateY(-4px);

            box-shadow:
                0 12px 30px rgba(20,184,166,0.25);
        }

        .footer {
            margin-top: 30px;

            color: #59627e;

            font-size: 10px;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="logo">
            W
        </div>

        <div class="tag">
            JAVA SERVLET EXPERIMENT
        </div>

        <h1>
            Dynamic Welcome Portal
        </h1>

        <p>
            A Java Servlet application that dynamically
            displays student information and the current
            date and time.
        </p>

        <a
            href="WelcomeServlet"
            class="button">

            Open Welcome Page →

        </a>

        <div class="footer">
            Apache Tomcat • Java Servlet
        </div>

    </div>

</body>

</html>
