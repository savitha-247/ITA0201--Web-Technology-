<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px;
        }

        .container {
            width: 550px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .heading h1 {
            color: #667eea;
            margin-bottom: 8px;
        }

        .heading p {
            color: #777;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #667eea;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heading">
            <h1>🎓 Student Registration</h1>
            <p>Enter your details below</p>
        </div>

        <form action="StudentRegistrationServlet" method="post">

            <div class="form-group">
                <label>👤 Student Name</label>
                <input type="text" name="name" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label>🆔 Register Number</label>
                <input type="text" name="regno" placeholder="Enter register number">
            </div>

            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" name="email" placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label>🏫 Department</label>
                <input type="text" name="department" placeholder="Enter department">
            </div>

            <div class="form-group">
                <label>📚 Semester</label>
                <input type="text" name="semester" placeholder="Enter semester">
            </div>

            <button type="submit" class="submit-btn">
                Submit Registration
            </button>

        </form>

    </div>

</body>
</html>
